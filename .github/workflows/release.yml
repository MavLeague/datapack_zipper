name: Build and Release Flet App

on:
  push:
    tags:
      - "v*"  # Triggers automatically when you push a tag like "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # 3.12 is currently stable for Flet
          cache: "pip"

      # --- Linux Dependencies ---
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # --- Python Packages ---
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install flet
          # If you have a requirements.txt, uncomment the next line:
          # pip install -r requirements.txt

      # --- BUILD PROCESS ---
      
      # 1. WINDOWS BUILD
      - name: Build Windows
        if: runner.os == 'Windows'
        # --product sets the EXE name and window title
        run: flet build windows --product "datapack_zipper"

      # Create Windows Installer (Inno Setup)
      - name: Setup Inno Setup
        if: runner.os == 'Windows'
        uses: Minionguyjosh/setup-inno-setup@v1.0.1

      - name: Generate and Run Installer Script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # We dynamically generate the Installer Script (.iss) here
          $AppName = "datapack_zipper"
          # Extract version from tag (removes the 'v')
          $Version = "${{ github.ref_name }}" -replace "v",""
          
          # Define the Inno Setup script content
          $Content = @"
          [Setup]
          AppName=$AppName
          AppVersion=$Version
          DefaultDirName={autopf}\$AppName
          DefaultGroupName=$AppName
          OutputBaseFilename=${AppName}_Setup_${{ github.ref_name }}
          OutputDir=installer_output
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          DisableProgramGroupPage=yes

          [Files]
          ; Source: Take the output from flet build (build/windows)
          Source: "build\windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\$AppName"; Filename: "{app}\$AppName.exe"
          Name: "{autodesktop}\$AppName"; Filename: "{app}\$AppName.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop icon"; GroupDescription: "Additional icons:"
          "@
          
          # Save the script to a file
          $Content | Out-File -FilePath "setup_script.iss" -Encoding ASCII
          
          # Run the Inno Setup Compiler (ISCC)
          ISCC setup_script.iss

      # 2. MACOS BUILD
      - name: Build macOS
        if: runner.os == 'macOS'
        run: flet build macos --product "datapack_zipper"

      - name: Package macOS (Zip)
        if: runner.os == 'macOS'
        run: |
          cd build/macos
          # Zip the .app bundle so it can be downloaded easily
          zip -r ../../datapack_zipper_macOS_${{ github.ref_name }}.zip "datapack_zipper.app"

      # 3. LINUX BUILD
      - name: Build Linux
        if: runner.os == 'Linux'
        run: flet build linux --product "datapack_zipper"

      - name: Package Linux (Tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd build/linux
          tar -czvf ../../datapack_zipper_Linux_${{ github.ref_name }}.tar.gz *

      # --- Upload Artifacts (Handover to Release Job) ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            installer_output/*.exe
            *.zip
            *.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # Merges all downloaded files into one folder

      - name: List Files (Debug)
        run: ls -R artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.tar.gz
