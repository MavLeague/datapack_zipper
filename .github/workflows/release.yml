name: Build and Release Flet App

on:
  push:
    tags:
      - "v*"  # Triggers automatically on tags like v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # --- insert version info ---
      - name: Inject Version
        shell: python
        run: |
          import re
          
          version = "${{ github.ref_name }}"
          file_path = "src/main.py"
          
          with open(file_path, "r", encoding="utf-8") as f:
              lines = f.readlines()
          
          if len(lines) >= 9:
              lines[8] = re.sub(r'(["\']).*?\1', f"\\g<1>{version}\\g<1>", lines[8], count=1)
              with open(file_path, "w", encoding="utf-8") as f:
                  f.writelines(lines)
              print(f"Updated line 9 in {file_path} with version {version}")

      # --- Linux Dependencies ---
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # --- Python Packages ---
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install flet
          # If you have a requirements.txt, uncomment the next line:
          # pip install -r requirements.txt

      # --- BUILD PROCESS ---
      
      # 1. WINDOWS BUILD
      - name: Build Windows
        if: runner.os == 'Windows'
        # IMPORTANT: This fixes the UnicodeEncodeError ('charmap' codec failed)
        env:
          PYTHONIOENCODING: utf-8
        run: flet build windows --product "datapack_zipper" --yes

      # Install Inno Setup (ONLY ON WINDOWS)
      - name: Setup Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      # Generate and Compile Installer Script (ONLY ON WINDOWS)
      - name: Generate and Run Installer Script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Dynamically create the Inno Setup Script
          $AppName = "datapack_zipper"
          # Extract version from tag (remove 'v')
          $Version = "${{ github.ref_name }}" -replace "v",""
          
          # Define the Inno Setup configuration content
          $Content = @"
          [Setup]
          AppName=$AppName
          AppVersion=$Version
          DefaultDirName={autopf}\$AppName
          DefaultGroupName=$AppName
          OutputBaseFilename=${AppName}_Setup_${{ github.ref_name }}
          OutputDir=installer_output
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          DisableProgramGroupPage=yes

          [Files]
          ; Source: Take the output from flet build (build/windows)
          Source: "build\windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\$AppName"; Filename: "{app}\$AppName.exe"
          Name: "{autodesktop}\$AppName"; Filename: "{app}\$AppName.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop icon"; GroupDescription: "Additional icons:"
          "@
          
          # Save content to file
          $Content | Out-File -FilePath "setup_script.iss" -Encoding ASCII
          
          # Compile using ISCC (Path set by Chocolatey)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup_script.iss

      # 2. LINUX BUILD
      - name: Build Linux
        if: runner.os == 'Linux'
        run: flet build linux --product "datapack_zipper" --yes

      - name: Package Linux (Tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd build/linux
          tar -czvf ../../datapack_zipper_Linux_${{ github.ref_name }}.tar.gz *

      # --- Upload Artifacts ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            installer_output/*.exe
            *.zip
            *.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # Merges all downloaded files into one folder

      - name: List Files (Debug)
        run: ls -R artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/**/*.exe
            artifacts/*.exe
            artifacts/**/*.zip
            artifacts/*.zip
            artifacts/*.tar.gz
